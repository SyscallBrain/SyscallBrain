<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Tiago Correia — Rust TUIs and offline-first Android apps">
  <title>Tiago Correia — SyscallBrain</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.55" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#292e42"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
    .line { opacity: 0; animation: in .45s ease-out forwards; }
    .l1 { animation-delay: .4s; }  .l2 { animation-delay: 1.0s; } .l3 { animation-delay: 1.6s; }
    .l4 { animation-delay: 2.2s; } .l5 { animation-delay: 2.8s; } .l6 { animation-delay: 3.4s; }
    .l7 { animation-delay: 4.0s; } .l8 { animation-delay: 4.6s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .hero { opacity: 0; animation: in .8s ease-out .1s forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .hero { animation: none; opacity: 1; }
      .cursor { animation: none; }
    }
    .fn { fill: #7aa2f7; } .str { fill: #9ece6a; } .num { fill: #ff9e64; }
    .p { fill: #a9b1d6; } .c { fill: #565f89; } .k { fill: #bb9af7; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)" opacity="0.6"/>
    <rect width="1200" height="360" fill="url(#glow)"/>

    <!-- title bar -->
    <rect width="1200" height="40" fill="#16161e"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#292e42"/>
    <circle cx="26" cy="20" r="6" fill="#f7768e"/>
    <circle cx="46" cy="20" r="6" fill="#e0af68"/>
    <circle cx="66" cy="20" r="6" fill="#9ece6a"/>
    <text x="600" y="25" text-anchor="middle" class="mono" font-size="13" fill="#565f89">tiago@syscallbrain: ~ — zsh</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#292e42"/>

  <!-- left: identity -->
  <g class="hero">
    <text x="56" y="100" class="mono" font-size="18"><tspan fill="#9ece6a">❯</tspan><tspan fill="#c0caf5" dx="10">whoami</tspan></text>
    <text x="52" y="172" class="sans" font-size="62" font-weight="800" fill="url(#name)" letter-spacing="-1">Tiago Correia</text>
    <text x="56" y="216" class="sans" font-size="21" fill="#a9b1d6">Fast terminal tools in <tspan fill="#ff9e64" font-weight="600">Rust</tspan> and private,</text>
    <text x="56" y="246" class="sans" font-size="21" fill="#a9b1d6">offline-first <tspan fill="#9ece6a" font-weight="600">Android</tspan> apps in <tspan fill="#bb9af7" font-weight="600">Kotlin</tspan>.</text>

    <g class="mono" font-size="13">
      <rect x="56" y="282" width="74" height="28" rx="14" fill="#ff9e64" fill-opacity="0.12" stroke="#ff9e64" stroke-opacity="0.5"/>
      <text x="93" y="301" text-anchor="middle" fill="#ff9e64">rust</text>
      <rect x="140" y="282" width="84" height="28" rx="14" fill="#bb9af7" fill-opacity="0.12" stroke="#bb9af7" stroke-opacity="0.5"/>
      <text x="182" y="301" text-anchor="middle" fill="#bb9af7">kotlin</text>
      <rect x="234" y="282" width="84" height="28" rx="14" fill="#9ece6a" fill-opacity="0.12" stroke="#9ece6a" stroke-opacity="0.5"/>
      <text x="276" y="301" text-anchor="middle" fill="#9ece6a">android</text>
      <rect x="328" y="282" width="70" height="28" rx="14" fill="#7aa2f7" fill-opacity="0.12" stroke="#7aa2f7" stroke-opacity="0.5"/>
      <text x="363" y="301" text-anchor="middle" fill="#7aa2f7">linux</text>
      <rect x="408" y="282" width="118" height="28" rx="14" fill="#7dcfff" fill-opacity="0.12" stroke="#7dcfff" stroke-opacity="0.5"/>
      <text x="467" y="301" text-anchor="middle" fill="#7dcfff">kvm/libvirt</text>
    </g>
  </g>

  <!-- right: strace of the brain -->
  <rect x="704" y="72" width="448" height="252" rx="12" fill="#16161e" stroke="#292e42"/>
  <g class="mono" font-size="13.5">
    <text x="726" y="102"><tspan class="c">$</tspan><tspan fill="#c0caf5" dx="8">strace -p $(pidof brain)</tspan></text>
    <line x1="726" y1="116" x2="1130" y2="116" stroke="#292e42"/>
    <text x="726" y="142" class="line l1"><tspan class="fn">openat</tspan><tspan class="p">(</tspan><tspan class="str">"ideas.md"</tspan><tspan class="p">, O_RDONLY) = </tspan><tspan class="num">3</tspan></text>
    <text x="726" y="164" class="line l2"><tspan class="fn">read</tspan><tspan class="p">(3, </tspan><tspan class="str">"a TUI for virsh"</tspan><tspan class="p">, 15) = </tspan><tspan class="num">15</tspan></text>
    <text x="726" y="186" class="line l3"><tspan class="fn">mmap</tspan><tspan class="p">(NULL, </tspan><tspan class="str">"coffee"</tspan><tspan class="p">, PROT_READ) = </tspan><tspan class="num">0x7f3c</tspan></text>
    <text x="726" y="208" class="line l4"><tspan class="fn">execve</tspan><tspan class="p">(</tspan><tspan class="str">"cargo"</tspan><tspan class="p">, [</tspan><tspan class="str">"build"</tspan><tspan class="p">, </tspan><tspan class="str">"--release"</tspan><tspan class="p">])</tspan></text>
    <text x="726" y="230" class="line l5"><tspan class="fn">clone</tspan><tspan class="p">(</tspan><tspan class="str">"android-app"</tspan><tspan class="p">, OFFLINE) = </tspan><tspan class="num">4242</tspan></text>
    <text x="726" y="252" class="line l6"><tspan class="fn">connect</tspan><tspan class="p">(</tspan><tspan class="str">"ads.tracker"</tspan><tspan class="p">) = </tspan><tspan fill="#f7768e">-1 EPERM</tspan></text>
    <text x="726" y="274" class="line l7"><tspan class="fn">write</tspan><tspan class="p">(1, </tspan><tspan class="str">"shipped ✓"</tspan><tspan class="p">, 9) = </tspan><tspan class="num">9</tspan></text>
    <text x="726" y="300" class="line l8"><tspan class="k">+++</tspan><tspan class="p"> still running </tspan><tspan class="k">+++</tspan><tspan class="cursor" fill="#c0caf5"> ▍</tspan></text>
  </g>
</svg>
