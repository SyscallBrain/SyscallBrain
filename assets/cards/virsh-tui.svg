<svg xmlns="http://www.w3.org/2000/svg" width="420" height="196" viewBox="0 0 420 196" role="img" aria-label="virsh-tui: Keyboard-driven terminal UI for libvirt/virsh, with vim keys, live per-vCPU graphs, snapshots and an editor that shows the XML diff first.">
  <title>virsh-tui</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2335"/><stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <clipPath id="c"><rect width="420" height="196" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="420" height="196" fill="url(#g)"/>
    <rect width="420" height="3" fill="#7aa2f7"/>
    <circle cx="390" cy="40" r="70" fill="#7aa2f7" fill-opacity="0.06"/>
  </g>
  <rect x="0.5" y="0.5" width="419" height="195" rx="14" fill="none" stroke="#292e42"/>
  <text x="24" y="38" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#565f89" letter-spacing="0.5">TERMINAL · VIRTUALIZATION</text>
  <text x="24" y="72" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#c0caf5">virsh-tui</text>
  <text x="396" y="72" text-anchor="end" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#7aa2f7">↗</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="14" fill="#a9b1d6">
