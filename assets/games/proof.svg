<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="How every level is proven: the game and its offline solver share one deterministic Kotlin engine. The solver writes a certificate, CI replays it, and the build fails if a level can no longer be won. 9,000 certified level variants across five games.">
  <title>One engine, two jobs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2335"/><stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#9ece6a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#9ece6a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#292e42"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#565f89"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f7768e"/>
    </marker>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
  </style>

  <rect width="1000" height="500" fill="url(#bg)"/>
  <rect width="1000" height="500" fill="url(#grid)" opacity="0.6"/>
  <rect width="1000" height="500" fill="url(#glow)"/>
  <rect width="1000" height="4" fill="#9ece6a"/>

  <text x="56" y="80" class="mono" font-size="19" fill="#565f89" letter-spacing="1">HOW EVERY LEVEL IS PROVEN</text>
  <text x="54" y="142" class="sans" font-size="52" font-weight="800" fill="#c0caf5" letter-spacing="-1">One engine, two jobs</text>
  <text x="56" y="184" class="sans" font-size="23" fill="#a9b1d6">The game and its offline solver run the same deterministic Kotlin code.</text>

  <g class="mono" font-size="24" text-anchor="middle">
    <rect x="56" y="232" width="150" height="60" rx="30" fill="#7aa2f7" fill-opacity="0.12" stroke="#7aa2f7" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="131" y="270" fill="#7aa2f7">solver</text>
    <line x1="212" y1="262" x2="250" y2="262" stroke="#565f89" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="258" y="232" width="210" height="60" rx="30" fill="#bb9af7" fill-opacity="0.12" stroke="#bb9af7" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="363" y="270" fill="#bb9af7">certificate</text>
    <line x1="474" y1="262" x2="512" y2="262" stroke="#565f89" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="520" y="232" width="180" height="60" rx="30" fill="#7dcfff" fill-opacity="0.12" stroke="#7dcfff" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="610" y="270" fill="#7dcfff">CI replay</text>
    <line x1="706" y1="262" x2="744" y2="262" stroke="#565f89" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="752" y="232" width="192" height="60" rx="30" fill="#9ece6a" fill-opacity="0.14" stroke="#9ece6a" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="848" y="270" fill="#9ece6a">✓ ships</text>

    <path d="M610 298 V346 H744" fill="none" stroke="#f7768e" stroke-opacity="0.8" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="752" y="318" width="192" height="56" rx="28" fill="#f7768e" fill-opacity="0.10" stroke="#f7768e" stroke-opacity="0.6" stroke-width="1.5"/>
    <text x="848" y="354" font-size="21" fill="#f7768e">✗ build fails</text>
  </g>

  <line x1="56" y1="404" x2="944" y2="404" stroke="#292e42"/>
  <text x="54" y="462" class="sans" font-size="54" font-weight="800" fill="#9ece6a" letter-spacing="-1">9,000</text>
  <text x="240" y="455" class="sans" font-size="23" fill="#a9b1d6">certified level variants across five games</text>
</svg>
