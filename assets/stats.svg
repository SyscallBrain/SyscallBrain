<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="4 Rust terminal tools, 10 Android apps and games, 9,000 certified level variants, and 0 ads, trackers or accounts">
  <title>SyscallBrain in numbers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2335"/><stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#292e42"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="150" rx="14"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif; }
    .stat { opacity: 0; animation: in .6s ease-out forwards; }
    .s1 { animation-delay: .15s; } .s2 { animation-delay: .35s; } .s3 { animation-delay: .55s; } .s4 { animation-delay: .75s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .stat { animation: none; opacity: 1; } }
    .n { font-size: 56px; font-weight: 800; letter-spacing: -1px; }
    .l { font-size: 20px; fill: #a9b1d6; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <rect width="1200" height="150" fill="url(#grid)" opacity="0.5"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="149" rx="14" fill="none" stroke="#292e42"/>
  <g stroke="#292e42">
    <line x1="300" y1="34" x2="300" y2="116"/>
    <line x1="600" y1="34" x2="600" y2="116"/>
    <line x1="900" y1="34" x2="900" y2="116"/>
  </g>

  <g class="sans" text-anchor="middle">
    <g class="stat s1"><text x="150" y="82" class="n" fill="#ff9e64">4</text><text x="150" y="116" class="l">Rust terminal tools</text></g>
    <g class="stat s2"><text x="450" y="82" class="n" fill="#bb9af7">10</text><text x="450" y="116" class="l">Android apps and games</text></g>
    <g class="stat s3"><text x="750" y="82" class="n" fill="#9ece6a">9,000</text><text x="750" y="116" class="l">certified level variants</text></g>
    <g class="stat s4"><text x="1050" y="82" class="n" fill="#7dcfff">0</text><text x="1050" y="116" class="l">ads, trackers or accounts</text></g>
  </g>
</svg>
